name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/validate-release-tag.mjs "$RELEASE_TAG"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint -- --deny-warnings
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build

      - name: Create webui.zip
        working-directory: dist
        run: zip -r ../webui.zip .

      # Extract the tagged CHANGELOG section, never [Unreleased]. The tag is
      # validated above and passed to this script as environment data.
      - name: Build release body
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_body.md
          if [ ! -s release_body.md ]; then
            echo "::error::No CHANGELOG.md section found for version ${VERSION} (expected '## [${VERSION}]')."
            exit 1
          fi
          if grep -qE '^## \[Unreleased\]' release_body.md; then
            echo '::error::Release body resolved to [Unreleased]; refusing to publish incorrect notes.'
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            webui.zip
            release_body.md
          retention-days: 1

  publish:
    name: Publish release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_created: ${{ steps.create.outputs.release_created }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release-files

      - name: Create draft release
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo '::error::A release already exists for this tag; refusing to replace it.'
            exit 1
          fi

          gh release create "$RELEASE_TAG" \
            --draft \
            --title "$RELEASE_TAG" \
            --notes-file release-files/release_body.md \
            --repo "$GITHUB_REPOSITORY" \
            release-files/webui.zip
          echo 'release_created=true' >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest --repo "$GITHUB_REPOSITORY"

  cleanup:
    name: Cleanup failed release
    needs: [build, publish]
    if: >-
      failure() && needs.build.result == 'success' && needs.publish.result == 'failure' &&
      needs.publish.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete draft release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release delete "$RELEASE_TAG" --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
