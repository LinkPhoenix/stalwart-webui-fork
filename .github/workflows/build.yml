name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npx eslint src/

      - run: npx vitest run

      - run: npm run build

      - name: Create webui.zip
        working-directory: dist
        run: zip -r ../webui.zip .

      # Extract the CHANGELOG section for this tag (v1.2.3 → ## [1.2.3]), never
      # ## [Unreleased]. The old `awk ... c==1` always took the first heading,
      # which is Unreleased and left GitHub releases empty after a cut.
      - name: Build release body
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_body.md
          if [ ! -s release_body.md ]; then
            echo "::error::No CHANGELOG.md section found for version ${VERSION} (expected '## [${VERSION}]')."
            exit 1
          fi
          if grep -qE '^## \[Unreleased\]' release_body.md; then
            echo "::error::Release body resolved to [Unreleased]; refusing to publish empty/wrong notes."
            exit 1
          fi
          echo "Release notes for ${VERSION}:"
          cat release_body.md

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: webui.zip
          body_path: release_body.md
          # Tag-push releases are created as drafts; the `publish` job un-drafts
          # them only after the build succeeds, so watcher notifications don't
          # fire on broken builds.
          draft: true

  publish:
    name: Publish release
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Un-draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest --repo "${{ github.repository }}"

  cleanup:
    name: Cleanup failed release
    needs: [build]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete draft release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ github.ref_name }}" --yes --cleanup-tag --repo "${{ github.repository }}" || true
